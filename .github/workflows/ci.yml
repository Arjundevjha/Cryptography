name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: web/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r web/requirements.txt

      - name: Run repository pytest suite
        run: pytest -q

      - name: Run FastAPI backend tests
        run: python3 -m pytest web/api/test_main.py -q

  frontend-test-and-build:
    name: Frontend Test & Build (Node 22)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run Jest unit tests
        working-directory: web
        run: npm test -- --silent

      - name: Build Next.js production bundle
        working-directory: web
        run: npx next build

  e2e-test:
    name: Playwright E2E (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [backend-test, frontend-test-and-build]
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web/requirements.txt

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E test suite
        run: bash scripts/run_e2e.sh --shard=${{ matrix.shard }}

      - name: Upload Playwright report and server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-artifacts-${{ strategy.job-index }}
          path: |
            web/playwright-report/
            test-results/
          retention-days: 7

  python-lint:
    name: Python Lint (pylint methods/)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pytest is installed because pylint resolves pytest imports in methods/
      # test modules; without it pylint reports E0401 (import-error).
      - name: Install pylint and pytest
        run: python -m pip install --upgrade pip && python -m pip install pylint pytest

      # pylint exits non-zero if any issue is found or the score is below 10
      # (fail-under default). The repo maintains methods/ at 10.00/10.
      - name: Run pylint on methods/
        run: python -m pylint methods/

  dead-code:
    name: Dead-Code Audit (fallow)
    runs-on: ubuntu-24.04
    needs: [frontend-test-and-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run fallow dead-code audit
        working-directory: web
        run: npx --yes fallow dead-code

  diagnostics:
    name: Repository Diagnostics (diagnose.py --check)
    runs-on: ubuntu-24.04
    needs: [backend-test, frontend-test-and-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r web/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run repository diagnostic suite
        run: python3 scripts/diagnose.py --check

  deploy:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-24.04
    needs: [backend-test, frontend-test-and-build, e2e-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Vercel Production Deploy Hook
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
